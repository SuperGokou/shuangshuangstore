name: Refresh JunAn Orders

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: junanex-orders-refresh
  cancel-in-progress: false

jobs:
  refresh-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Refresh JunAn order data
        env:
          JUNANEX_HEADLESS: "true"
          JUNANEX_EMAIL: ${{ secrets.JUNANEX_EMAIL }}
          JUNANEX_PASSWORD: ${{ secrets.JUNANEX_PASSWORD }}
          JUNANEX_SESSION_JSON_B64: ${{ secrets.JUNANEX_SESSION_JSON_B64 }}
          JUNANEX_OUTPUT_PATH: data/junanex-orders.json
          JUNANEX_MAX_PAGES: "10"
          JUNANEX_MAX_ORDER_DETAIL_PAGES: "200"
          JUNANEX_MAX_TRACKING_PAGES: "120"
        run: python scripts/junanex_scraper.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/junanex-orders.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          orders = data.get("orders", [])
          if data.get("source") != "junanex":
              raise SystemExit("data/junanex-orders.json is not JunAn data")
          if not isinstance(orders, list):
              raise SystemExit("data/junanex-orders.json orders must be a list")
          print(f"JunAn orders: {len(orders)}")
          print(f"With tracking history: {sum(1 for item in orders if item.get('tracking_history'))}")
          PY

      - name: Commit refreshed order data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/junanex-orders.json
          if git diff --cached --quiet; then
            echo "No JunAn order changes to commit."
          else
            git commit -m "chore: refresh JunAn orders"
            git push
          fi
